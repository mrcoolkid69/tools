<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="logo.png">
    <script src="budgting.js" defer></script>
    <title>Tools</title>
    <link rel="stylesheet" href="defaults.css" />
    <style>

        .row {
            display: flex;
            flex-direction: row;
            flex: auto;
            width: 70%;
            margin: auto;
        }

        @media only screen and (max-width: 880px) {
            .row {
                width: 100%;
            }
        }

        @media screen and (max-width:600px) {
            .row {
                flex-direction: column !important;
                flex: auto !important;
            }

        }

        label,
        .text {
            background-color: #f3f3f3;
            font-size: 20px;
            color: black;
            border-radius: 5px;
            display: block;
            margin: auto;
            text-align: center;
            width: 30%;
            padding: 3px 5px;
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="intereset.html">Interest Calculator</a>
        <a href="budgting.html" class="active">Budgting Calculator</a>
        <a href="textmirror.html">Text Mirror</a>
    </nav>
    <header>Budgting Calculator</header>
    <br>
    <label>Total Balance
        <input class="numbers" type="number" id="budgting" value="100" min="0" max="999999999">
    </label>
    <br> 
    <form class="row">
        <label>Needs %
            <input class="numbers" type="number" id="needs" value="50" min="0" max="100">
        </label>
        <label>Wants %
            <input class="numbers" type="number" id="wants" value="30" min="0" max="100">
        </label>
        <label>Savings %
            <input class="numbers" type="number" id="saves" value="20" min="0" max="100">
        </label>
    </form>
    <br>
    <button class="submit" onclick="calcbudget()">Calculate</button>
    <br>
    <table class="math">
        <tr>
            <th>Needs</th>
            <th>Wants</th>
            <th>Savings</th>
        </tr>
        <tr>
            <td id="need"></td>
            <td id="want"></td>
            <td id="save"></td>
        </tr>
    </table>
</body>

</html>
