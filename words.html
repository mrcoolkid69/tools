    <style>
        .text {
            width: 90vw;
            max-width: 800px;
            display: block;
            margin: 10px auto;
            height: 40vh;
            border: 3px double gray;
            border-radius: 10px/16px;
        }

        .top-words { 
            width: 90vw;
            max-width: 800px;
            display: block;
            margin: 10px auto;
            border: 3px double gray;
            border-radius: 10px/16px;
            padding: 10px;
            background-color: #f9f9f9;
        }

        .top-words h3 {
            margin-top: 10px;
            text-align: center;
        }

        .top-words ul {
            padding: 0;
            margin: 0;
        }

        .top-words li {
            margin: 25px auto; 
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            text-transform: Capitalize;
            width:40%;
 
        }

    <br>

    <textarea class="text" id="text" rows="10" cols="500">
</textarea>
    <br>
    <input class="numbers" type="number" id="wordShowing" placeholder="Enter words to show">

    <button onclick="runCountWords()" class="submit">Word amount</button>
