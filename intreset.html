<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="logo.png">
    <title>Tools</title>
    <link rel="stylesheet" href="defaults.css" />
    <script src="interest.js" defer></script>
    <style> 
        .header {
            font-size: 40px;
            text-align: center;
        }

        hr {
            width: 20%;
        }

        .select {
            width: fit-content;
            display: block;
            margin: auto;
            border:2px black solid;
            border-radius:6px;
            font-size:20px;
        }

        .numbers {
            width: 12%;
            display: block;
            margin: auto;
            background-color: #f0f0f0;
            color: black;
            border: rgb(92, 92, 117) solid 2px;
            border-radius: 10px;
            padding: 3px 5px;
            font-size: 16px;
            transition: 0.3s;
        }

        .numbers:focus {
            outline: none;
            border: #a2a2b8 solid 2px;
            filter: drop-shadow(3px 5px 3px #000000da);
        }

        h2 {
            text-align: center;
        }

        .submit {
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            margin: auto;
            display: block;
            font-weight: 900;
            background-color: #ebebeb;
            border: rgb(43, 43, 43) solid 2px;
            border-radius: 10px;
            padding: 1px 5px;
            transition: 0.3s;
        }

        .submit:hover {
            transform: translateY(-4px);
            filter: drop-shadow(3px 5px 3px #000000da);
            cursor: pointer;
        }

        .submit:active {
            transform: translateY(0px);
            filter: drop-shadow(0px 0px 0px #000000da);
        }

        .math {
            font-size: 20px;
            color: #3e3e3e;
            width: fit-content;
            margin: auto;
            padding: 3px 5px;
            border: gray 2px solid;
            border-radius: 15px;
            background-color: rgb(255, 255, 255);
            background-image: url('paper.jpeg');
            font-family: "Lucida Console", "Courier New", monospace;
        }

        .math th,
        td {
            border: 3px double gray;
            text-align: center;
            border-radius: 10px/16px;
            padding: 0px 4px;
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="intreset.html" class="active">Interest Calculator</a>
        <a href="budgting.html">Budgting Calculator</a>
        <a href="textmirror.html">Text Mirror</a>
    </nav>
    <header>Interest Calculator</header>
    <br>
    <select class="select" id="type">
        <option value="simple">Simple Interest</option>
        <option value="compound">Compound Interest</option>
        <option value="rate">Interest Paid</option>
    </select>

    <h2>Principal amount</h2>
    <input class="numbers" type="number" id="princ" name="number" step="50" min="0" value="500">
    <hr>
    <div id="rates">
        <h2>Rate (%)</h2>
        <input class="numbers" type="number" id="rte" name="number" step="0.01" value="5">
    </div>
    <hr>
    <h2>Years</h2>
    <input class="numbers" type="number" id="time" name="number" min="1" max="10000" value="5">

    <br>
    <button class="submit" onclick="calculate()">Calculate</button>
    <br>
    <br>
    <table id="money" class="math">
        <tr>
            <th>Year</th>
            <th>Interest</th>
            <th>Total Amount</th>
        </tr>

    </table>
</body>

</html>
