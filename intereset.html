<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="logo.png">
    <title>Tools</title>
    <link rel="stylesheet" href="defaults.css" />
    <script src="interest.js" defer></script>
    <style>

        hr {
            width: 20%;
        }
        .adv {
            display: none;
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="intreset.html" class="active">Interest Calculator</a>
        <a href="budgting.html">Budgting Calculator</a>
        <a href="textmirror.html">Text Mirror</a>
    </nav>
    <header>Interest Calculator</header>
    <br>
    <select class="select" id="type">
        <option value="simple">Simple Interest</option>
        <option value="compound">Compound Interest</option>
        <option value="rate">Interest Paid</option>
    </select>

    <h2>Principal amount</h2>
    <input class="numbers" type="number" id="princ" name="number" step="50" min="0" value="500">
    <hr>
    <div id="rates">
        <h2>Rate (%)</h2>
        <input class="numbers" type="number" id="rte" name="number" step="0.01" value="5">
    </div>
    <hr>
    <h2 id="tableTime">Years</h2>
    <input class="numbers" type="number" id="time" name="number" min="1" max="10000" value="5">
    <hr class="adv">
    <br>

    <h2 class="adv">Time Increments</h2>
    <select class="select adv" id="advtime" onchange="timeChanged()">
        <option value="Year">Years</option>
        <option value="Month">Months</option>
        <option value="Day">Days</option>
    </select>
    <hr class="adv">
    <br>
    <h2 class="adv">Add per <span id="addedPer">Year</span></h2>
    <input class="numbers adv" type="number" id="addedPerMonth" name="number" min="1" max="10000" value="1" onchange="addPerMonthChange()">
    <br>
    <button onclick="advance()" class="submit">Advance tools</button>
    <br>
    <button class="submit" onclick="calculate()">Calculate</button>
    <br>

    <br>
    <table id="money" class="math">
        <tr>
            <th id="tableTime">Years</th>
            <th>Interest</th>
            <th>Total Amount</th>
        </tr>

    </table>
</body>

</html>
