	Greed in Catching Fire
	Have you ever won something but did not actually win? In Catching Fire by Suzanne Collins the main character Katniss is a victor of the Hunger Games. The Hunger Games is a deadly competition where 24 kids, ages 12-17, fight to the death. Katniss won, but she made President Snow mad and she is now in danger. President Snow controls all of Panem, and makes Katniss go back into the Hunger Games in an attempt to kill her. The theme in Catching Fire, greed ruins relationships, is seen in Katniss, Snow, Peeta, and Gale.

	Round characters in Catching Fire show the theme that greed ruins relationships because the reader knows enough about them to see their relationship with others. Round characters like Katniss, Peeta, and Gale show the theme because Katniss wants both of them, and ruins her relationship with them. In Catching Fire, Gale becomes more distant from Katniss (Collins 5). Gale is distant because he is jealous that she is with Peeta. Katniss wanted to be with Peeta and Gale at the same time. Her greed of wanting both ruins her relationship with them. Since Katniss wants Gale, but has to be with Peeta neither of them are happy with it. In addition, Katniss and President Snow have a bad relationship because Katniss wants to be free, but also keep her family safe. When talking to Haymich, Katniss realizes that she has to do what Snow wants to keep herself and her family alive (Collins 44). She knows that staying alive comes with the cost of her freedom, but her greed causes her to try to have both. Because of that, District 12 is put under stricter law and people she knows are getting punished. It ruins her relationship with Snow because she causes lots of problems to him. It also ruins her relationship with Gale, because she still tries to do what Snow wants which makes him mad. To sum it all up, round characters show the theme that greed ruins relationships because we can see how they are affected by others' greed.
